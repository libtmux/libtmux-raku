name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - tools/check-release.raku
      - tools/publish-github-release.sh
      - tools/release-retry.sh
      - xt/*release*.rakutest
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare an archive, publish a tag, or verify a manual upload
        type: choice
        options: [prepare, publish, verify]
        default: prepare

permissions:
  contents: read
  actions: read

concurrency:
  group: fez-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    name: Publish to zef
    needs: verify
    if: >-
      github.repository == 'libtmux/libtmux-raku' &&
      github.ref_type == 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: fez
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.verify.outputs.compiler }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist/
      - name: Verify the retained archive
        run: |
          zef install --deps-only .
          raku tools/check-release.raku --dist=dist "v$RELEASE_VERSION"
      - name: Check earlier upload attempts
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-retry.sh upload
      - name: Install the pinned publisher
        if: steps.upload.outputs.needed == 'true'
        run: zef install 'fez:ver<100.0.2>:auth<zef:tony-o>'
      - name: Upload the tested archive
        if: steps.upload.outputs.needed == 'true'
        env:
          FEZ_KEY: ${{ secrets.FEZ_KEY }}
          PUBLISH_CONFIG: ${{ runner.temp }}/fez-publish.json
        run: |
          test -n "$FEZ_KEY" || { echo 'Set FEZ_KEY in the fez environment before publishing.' >&2; exit 1; }
          umask 077
          trap 'rm -f "$PUBLISH_CONFIG"' EXIT
          raku -e '
            use Fez::Util::Config;
            use Fez::Util::Json;
            my %config = env-config;
            %config<ecosystems> = { zef => %config<host> };
            %config<key> = %*ENV<FEZ_KEY>;
            %*ENV<PUBLISH_CONFIG>.IO.spurt(to-j(%config));
          '
          FEZ_CONFIG="$PUBLISH_CONFIG" fez --unattended upload --file="dist/LibTmux-$RELEASE_VERSION.tar.gz"

  registry:
    name: Verify registry installation
    needs: [verify, publish]
    if: >-
      always() && needs.verify.result == 'success' &&
      github.repository == 'libtmux/libtmux-raku' && github.ref_type == 'tag' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.verify.outputs.compiler }}
      - name: Install and exercise the exact public distribution
        run: |
          zef install --deps-only .
          /usr/bin/time -f 'whole command: %e s' raku tools/check-install.raku --registry

  github-release:
    name: Publish GitHub release
    needs: [verify, registry]
    if: >-
      always() && needs.verify.result == 'success' && needs.registry.result == 'success' &&
      github.repository == 'libtmux/libtmux-raku' && github.ref_type == 'tag' &&
      (github.event_name == 'push' || inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.verify.outputs.compiler }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist/
      - name: Verify the retained archive
        run: |
          zef install --deps-only .
          raku tools/check-release.raku --dist=dist "$RELEASE_TAG"
      - name: Publish the verified archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-github-release.sh dist "$RELEASE_TAG" "$GITHUB_REPOSITORY"
