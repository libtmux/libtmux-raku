name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      compiler:
        value: ${{ jobs.prepare.outputs.compiler }}
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      compiler: ${{ steps.compiler.outputs.version }}
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the declared compiler
        id: compiler
        run: sed --quiet 's/^raku /version=/p' .tool-versions >> "$GITHUB_OUTPUT"
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ steps.compiler.outputs.version }}
      - name: Install declared dependencies
        run: zef install --deps-only .
      - name: Check the declared compiler
        run: raku scripts/check-tool-versions/check-tool-versions.raku
      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release && github.ref_type == 'tag' && github.ref_name || '' }}
        run: raku scripts/check-release/check-release.raku --github-output "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Derive supported endpoints
        id: matrix
        run: raku -I. scripts/ci-matrix/ci-matrix.raku --github-output >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check example width
        uses: libtmux/.github/actions/check-example-width@bd3bae79572512da032287202d74c8da03b5967b
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.prepare.outputs.compiler }}
      - name: Install package dependencies
        run: zef install --deps-only .
      - name: Install author dependencies
        run: zef install Test::META App::Prove6
      - name: Source hygiene and package inventory
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-source/check-source.raku
      - name: Compile the public import
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. -c lib/LibTmux.rakumod
      - name: Compile the examples, support scripts and test helpers
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-compile/check-compile.raku examples scripts t/lib
      - name: Pure contracts
        run: |
          /usr/bin/time -f 'whole command: %e s' prove6 --jobs=2 -I. t
      - name: Package metadata
        run: |
          /usr/bin/time -f 'whole command: %e s' raku xt/meta.rakutest
      - name: Script contracts
        run: |
          /usr/bin/time -f 'whole command: %e s' prove6 --jobs=2 -I. scripts
      - name: Check the generated accessors
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/catalogue/catalogue.raku \
            --format=raku \
            --output=lib/LibTmux/Fields.rakumod \
            --check
      - name: Check the generated reference
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/catalogue/catalogue.raku \
            --format=rakudoc \
            --output=docs/reference/catalogue.rakudoc \
            --check
      - name: Extract the native public API
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/export-docs/export-docs.raku \
            --output=docs/_build/api.json
      - name: Require documentation for every public declaration
        run: raku -I. scripts/export-docs/export-docs.raku --require-documented=docs/_build/api.json
      - name: Check the documentation examples against their source
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-examples/check-examples.raku --check-source
      - name: Check retained release archive on a retry
        id: retained
        if: inputs.release && github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: raku scripts/release-retry/release-retry.raku archive "$RUNNER_TEMP/release"
      - name: Build the release archive
        if: steps.retained.outputs.restored != 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: raku scripts/build-archive/build-archive.raku "$RUNNER_TEMP/release" "$RELEASE_VERSION"
      - name: Check the release archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: raku scripts/check-release/check-release.raku --dist="$RUNNER_TEMP/release" "v$RELEASE_VERSION"
      - name: Install the release archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-install/check-install.raku \
            --archive="$RUNNER_TEMP/release/LibTmux-$RELEASE_VERSION.tar.gz"
      - name: Retain the tested release archive
        if: inputs.release && steps.retained.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  live:
    name: tmux ${{ matrix.tmux }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TMUX_VERSION: ${{ matrix.tmux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.prepare.outputs.compiler }}
      - name: Build the verified tmux source
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.commit }}
      - name: Check the built tmux version
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: '"$TMUX_BINARY" -V | grep --line-regexp --fixed-strings "tmux $TMUX_VERSION"'
      - name: Install package dependencies
        run: zef install --deps-only .
      - name: Install test dependencies
        run: zef install App::Prove6
      - name: Required live contracts
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: |
          /usr/bin/time -f 'whole command: %e s' prove6 --verbose -I. -It/lib xt/live \
            | raku scripts/check-skips/check-skips.raku
      - name: Execute self-checking examples
        env:
          LIBTMUX_TEST_TMUX: ${{ steps.tmux.outputs.binary }}
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-examples/check-examples.raku

  required:
    name: Required checks
    if: always()
    needs: [prepare, quality, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.prepare.outputs.compiler }}
      - name: Install declared dependencies
        run: zef install --deps-only .
      - name: Require every declared job
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          raku scripts/check-required/check-required.raku \
            --prepare="$PREPARE_RESULT" \
            --quality="$QUALITY_RESULT" \
            --live="$LIVE_RESULT" \
            --matrix="$MATRIX" \
            --repository="$GITHUB_REPOSITORY" \
            --run-id="$GITHUB_RUN_ID"
