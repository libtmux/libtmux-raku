name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      compiler:
        value: ${{ jobs.prepare.outputs.compiler }}
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      compiler: ${{ steps.compiler.outputs.version }}
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the declared compiler
        id: compiler
        run: |
          version=$(awk '$1 == "raku" { if (NF != 2) exit 1; print $2; count++ } END { if (count != 1) exit 1 }' .tool-versions)
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ steps.compiler.outputs.version }}
      - name: Install declared dependencies
        run: zef install --deps-only .
      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tag="${RELEASE_TAG:-v$(jq --raw-output .version META6.json)}"
          version=$(raku scripts/check-release/check-release.raku "$tag")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Derive supported endpoints
        id: matrix
        run: |
          matrix=$(raku -I. scripts/ci-matrix/ci-matrix.raku)
          printf 'value=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.prepare.outputs.compiler }}
      - name: Install package and author dependencies
        run: |
          zef install --deps-only .
          zef install Test::META App::Prove6
      - name: Source hygiene and package inventory
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-source/check-source.raku
      - name: Compile the public import
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. -c lib/LibTmux.rakumod
      - name: Pure contracts
        run: |
          /usr/bin/time -f 'whole command: %e s' prove6 --jobs=2 -I. t
      - name: Package metadata
        run: |
          /usr/bin/time -f 'whole command: %e s' raku xt/meta.rakutest
      - name: Release identity contracts
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-release/tests/check-release.rakutest
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-release/tests/check-release-archive.rakutest
          /usr/bin/time -f 'whole command: %e s' raku scripts/publish-github-release/tests/publish-github-release.rakutest
          /usr/bin/time -f 'whole command: %e s' raku scripts/release-retry/tests/release-retry.rakutest
      - name: Script contracts
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/catalogue/tests/catalogue.rakutest
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-examples/tests/check-examples.rakutest
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-install/tests/check-install.rakutest
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-source/tests/check-source.rakutest
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/ci-matrix/tests/ci-matrix.rakutest
      - name: Generated accessors and reference
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/catalogue/catalogue.raku \
            --format=raku \
            --output=lib/LibTmux/Fields.rakumod \
            --check
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/catalogue/catalogue.raku \
            --format=rakudoc \
            --output=docs/reference/catalogue.rakudoc \
            --check
      - name: Native documentation extraction contracts
        run: |
          /usr/bin/time -f 'whole command: %e s' prove6 -I. scripts/export-docs/tests/export-docs.rakutest
      - name: Extract the native public API
        run: |
          /usr/bin/time -f 'whole command: %e s' raku -I. scripts/export-docs/export-docs.raku \
            --output=docs/_build/api.json
          jq --exit-status \
            '(.missingDocumentation | type == "object" and length == 0)' \
            docs/_build/api.json
      - name: Compile executable examples
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-examples/check-examples.raku --check-source
          for example in examples/*.raku; do
            /usr/bin/time -f 'whole command: %e s' raku -I. -c "$example"
          done
      - name: Check retained release archive on a retry
        id: retained
        if: inputs.release && github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: raku scripts/release-retry/release-retry.raku archive "$RUNNER_TEMP/release"
      - name: Build and test the committed distribution
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RESTORED: ${{ steps.retained.outputs.restored }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/LibTmux-$RELEASE_VERSION.tar.gz"
          if test "$RESTORED" != true; then
            git archive --format=tar.gz --output="$archive" HEAD
            (
              cd "$RUNNER_TEMP/release"
              sha256sum "LibTmux-$RELEASE_VERSION.tar.gz" > SHA256SUMS
            )
          fi
          raku scripts/check-release/check-release.raku --dist="$RUNNER_TEMP/release" "v$RELEASE_VERSION"
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-install/check-install.raku --archive="$archive"
      - name: Retain the tested release archive
        if: inputs.release && steps.retained.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  live:
    name: tmux ${{ matrix.tmux }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TMUX_VERSION: ${{ matrix.tmux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Raku/setup-raku@8602b3572876ee7a5e304837c3183cf913a78f47 # v1.15.0
        with:
          raku-version: ${{ needs.prepare.outputs.compiler }}
      - name: Install the live-suite tools
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes ripgrep
      - name: Build the verified tmux source
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.commit }}
      - name: Select the verified tmux
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: |
          test "$("$TMUX_BINARY" -V)" = "tmux $TMUX_VERSION"
          printf 'LIBTMUX_TEST_TMUX=%s\n' "$TMUX_BINARY" >> "$GITHUB_ENV"
      - name: Install package and test dependencies
        run: |
          zef install --deps-only .
          zef install App::Prove6
      - name: Required live contracts
        run: |
          test -x "$LIBTMUX_TEST_TMUX"
          command -v rg
          /usr/bin/time -f 'whole command: %e s' prove6 --verbose -I. -It/lib xt/live \
            | tee "$RUNNER_TEMP/live.tap"
          if rg --ignore-case '(^|[[:space:]])#[[:space:]]*skip([[:space:]]|$)' "$RUNNER_TEMP/live.tap"; then
            echo 'Required live contracts must not skip tests' >&2
            exit 1
          fi
      - name: Execute self-checking examples
        run: |
          /usr/bin/time -f 'whole command: %e s' raku scripts/check-examples/check-examples.raku

  required:
    name: Required checks
    if: always()
    needs: [prepare, quality, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every declared job
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$LIVE_RESULT" = success
          expected=$(jq --compact-output --exit-status '
            select(type == "object" and keys == ["include"])
            | .include
            | select(type == "array" and (length == 1 or length == 2))
            | select(all(.[]; type == "object" and keys == ["commit", "tmux"]
                and (.tmux | type == "string" and test("^[0-9]+\\.[0-9]+[a-z]?$"))
                and (.commit | type == "string" and test("^[0-9a-f]{40}$"))))
            | select((map(.tmux) | unique | length) == length)
            | select((map(.commit) | unique | length) == length)
          ' <<< "$MATRIX")
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/jobs.json"
          jq --exit-status --slurp --argjson endpoints "$expected" '
            [.[].jobs[]] as $jobs
            | (["Prepare", "Quality"] + [$endpoints[] | "tmux " + .tmux]) as $expected
            | all($expected[]; . as $name
                | [$jobs[] | select((.name | split(" / ") | last) == $name)] as $found
                | ($found | length) == 1
                  and $found[0].status == "completed"
                  and $found[0].conclusion == "success")
          ' "$RUNNER_TEMP/jobs.json"
